apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-console
  namespace: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-console
  template:
    metadata:
      labels:
        app: checkout-console
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: checkout-console
        - name: nginx-conf
          configMap:
            name: checkout-console-nginx-conf
---
# nginx:alpine listens on 80 by default; the NetworkPolicy for this
# namespace only opens 8080, so nginx is told to listen there instead.
# It also reverse-proxies /checkout and /orders/ to the orders Service, so
# the browser only ever talks to one origin -- a small preview of what
# Ingress/the Istio gateway take over for real in Phase 3/4.
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-console-nginx-conf
  namespace: console
data:
  default.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location /checkout {
            proxy_pass http://orders.orders.svc.cluster.local:8080;
        }
        location /orders/ {
            proxy_pass http://orders.orders.svc.cluster.local:8080;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-console
  namespace: console
spec:
  type: NodePort
  selector:
    app: checkout-console
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
