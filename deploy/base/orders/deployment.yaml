apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: orders
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: orders
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: orders
          image: localhost:5001/orders:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres.data.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: orders
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: INVENTORY_BASE_URL
              value: http://inventory.inventory.svc.cluster.local:8080
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: orderflow-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: orders
spec:
  selector:
    app: orders
  ports:
    - port: 8080
      targetPort: 8080
# orders-nodeport (NodePort 30080) was Phase 1/2's ad hoc front door and is
# deliberately removed here, not just superseded: testing during Phase 3
# found that curling a NodePort from *inside the same node* it lands on can
# reach the pod without the request ever being attributable to a
# pod/namespace NetworkPolicy can match (kube-proxy's local-node NodePort
# path doesn't always cross the CNI's normal pod-to-pod overlay the same
# way cross-node traffic does) -- confirmed live: with allow-ingress-to-orders
# tightened to only trust ingress-nginx/console, a clean pod-to-pod test from
# an unrelated namespace was correctly blocked, but curling this NodePort
# from orderflow-worker's own localhost still got through. Leaving the
# Service in place would have kept that bypass open. deploy/ingress/ is the
# real front door now; direct debugging access is `kubectl port-forward`.
