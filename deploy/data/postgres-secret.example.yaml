# Template. Copy to postgres-secret.yaml (gitignored) and fill in your own
# values, matching whatever you put in postgres-init-configmap.yaml -- these
# are plaintext by design for a single-node kind cluster behind
# NetworkPolicy, which is fine locally but is exactly why the real file with
# real values is never committed, even to a private repo.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: data
type: Opaque
stringData:
  POSTGRES_PASSWORD: <choose-a-password>
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: orders
type: Opaque
stringData:
  DB_USER: orders
  DB_PASSWORD: <choose-a-password>
---
