# Template. Copy to postgres-init-configmap.yaml (gitignored) and fill in
# the same passwords used in postgres-secret.yaml -- these have to match,
# since this is what actually sets each DB user's password on first boot.
#
# The official postgres image only provisions one DB/user via env vars.
# Every .sql file dropped in /docker-entrypoint-initdb.d/ runs once, on the
# very first boot against an empty data directory -- this is how orders and
# inventory each get their own database and login, matching the "one
# Postgres instance, per-service schema" scope trade-off from the plan.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: data
data:
  init-multiple-dbs.sql: |
    CREATE USER orders WITH PASSWORD '<same-password-as-secret>';
    CREATE DATABASE orders OWNER orders;

    CREATE USER inventory WITH PASSWORD '<same-password-as-secret>';
    CREATE DATABASE inventory OWNER inventory;

    CREATE USER payment WITH PASSWORD '<same-password-as-secret>';
    CREATE DATABASE payment OWNER payment;

    CREATE USER notifications WITH PASSWORD '<same-password-as-secret>';
    CREATE DATABASE notifications OWNER notifications;
