        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: notifications
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inventory
      ports:
        - { protocol: TCP, port: 6379 }
